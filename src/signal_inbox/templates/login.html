<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>Sign in / Signal</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ asset_url('style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a href="/" class="brand" aria-label="Signal — home"><span class="brand-icon">ϟ</span>signal<span class="brand-dot">.</span></a>
    <section class="panel auth-card">
      <div class="eyebrow">PRIVATE BY DEFAULT</div>
      <h1>Welcome <em>back.</em></h1>
      <p class="muted">Enter your Signal password to open your library and approve agent connections.</p>
      {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
        <button class="button primary" type="submit">Enter Signal ↗</button>
      </form>
    </section>
  </main>
</body>
</html>
