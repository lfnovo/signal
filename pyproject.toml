[project]
name = "signal-inbox"
version = "0.1.4"
description = "A personal reading inbox with extraction, summaries, source chat and MCP access"
readme = "README.md"
license = "MIT"
authors = [{ name = "Luis Novo" }]
requires-python = ">=3.13,<3.14"
keywords = ["mcp", "reading", "research", "knowledge-management", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: General",
]
dependencies = [
  "ai-prompter>=0.3",
  "content-core>=2",
  "esperanto>=2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jinja2>=3.1",
  "markdown-it-py>=3",
  "mcp>=2,<3",
  "python-dotenv>=1",
  "python-multipart>=0.0.20",
  "surrealdb>=2",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
docling = ["content-core[docling]>=2"]

[project.scripts]
signal = "signal_inbox.cli:main"

[project.urls]
Homepage = "https://github.com/lfnovo/signal"
Documentation = "https://github.com/lfnovo/signal/tree/main/docs"
Issues = "https://github.com/lfnovo/signal/issues"
Repository = "https://github.com/lfnovo/signal"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_inbox"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/extension", "/tests", "/docs", "/README.md", "/LICENSE", "/.env.example", "/.python-version", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
